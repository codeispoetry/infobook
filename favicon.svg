<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bgSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="contentSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F8FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <rect width="32" height="32" rx="8" ry="8" fill="url(#bgSmall)" />
  
  <!-- Info icon "i" -->
  <g transform="translate(16,16)">
    <!-- Dot above the i -->
    <circle cx="0" cy="-6" r="2" fill="url(#contentSmall)" />
    
    <!-- Main stem of the i -->
    <rect x="-1.5" y="-2" width="3" height="8" rx="1.5" ry="1.5" fill="url(#contentSmall)" />
    
    <!-- Base line -->
    <rect x="-3.5" y="6.5" width="7" height="1.5" rx="0.75" ry="0.75" fill="url(#contentSmall)" />
  </g>
</svg>
  <g fill="#2F4F4F">
    <rect x="13" y="22" width="1.5" height="4" rx="0.5"/>
    <rect x="15" y="22" width="1.5" height="4" rx="0.5"/>
    <rect x="17" y="22" width="1.5" height="4" rx="0.5"/>
  </g>
</svg>