<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 192 192" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="content" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F8FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <rect width="192" height="192" rx="48" ry="48" fill="url(#bg)" />
  
  <!-- Info icon "i" -->
  <g transform="translate(96,96)">
    <!-- Dot above the i -->
    <circle cx="0" cy="-35" r="12" fill="url(#content)" />
    
    <!-- Main stem of the i -->
    <rect x="-8" y="-15" width="16" height="45" rx="8" ry="8" fill="url(#content)" />
    
    <!-- Base line -->
    <rect x="-20" y="35" width="40" height="8" rx="4" ry="4" fill="url(#content)" />
  </g>
</svg>