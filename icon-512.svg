<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="content" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F8FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <rect width="512" height="512" rx="128" ry="128" fill="url(#bg)" />
  
  <!-- Info icon "i" -->
  <g transform="translate(256,256)">
    <!-- Dot above the i -->
    <circle cx="0" cy="-95" r="32" fill="url(#content)" />
    
    <!-- Main stem of the i -->
    <rect x="-22" y="-40" width="44" height="120" rx="22" ry="22" fill="url(#content)" />
    
    <!-- Base line -->
    <rect x="-55" y="95" width="110" height="22" rx="11" ry="11" fill="url(#content)" />
  </g>
</svg>